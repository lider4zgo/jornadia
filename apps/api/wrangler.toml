# Un solo Worker sirve la app web (archivos estáticos) y la API (/api/*).
# Misma dirección para ambos: sin problemas de CORS y un solo despliegue.
name = "korporia"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "korporia-files"

[vars]
# URL del proyecto "korporia" en Supabase (Project Settings → Data API)
SUPABASE_URL = "https://TU-PROYECTO.supabase.co"
# Dominio ficticio para las cuentas de colaboradores (no se envían correos)
WORKER_EMAIL_DOMAIN = "trabajadores.korporia.com"

# Secretos (no van en este archivo):
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_ANON_KEY
# Para desarrollo local, crea apps/api/.dev.vars con esas dos variables.
