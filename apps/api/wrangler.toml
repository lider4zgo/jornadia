# Un solo Worker sirve la app web (archivos estáticos) y la API (/api/*).
# Misma dirección para ambos: sin problemas de CORS y un solo despliegue.
name = "korporia"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Dominio propio de la app. La zona korporia.com está en esta misma cuenta de
# Cloudflare; al desplegar se crea el registro DNS y el certificado.
routes = [
  { pattern = "app.korporia.com", custom_domain = true }
]

[assets]
directory = "../web/dist"
binding = "ASSETS"
# El Worker decide qué servir según el dominio (ver src/lib/static.ts):
# korporia.com → sitio en /_site; app.korporia.com → la app.
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "FILES"
bucket_name = "korporia-files"

[vars]
# URL del proyecto "korporia" en Supabase (Project Settings → Data API)
SUPABASE_URL = "https://obrzmsaxiafcyjbfdmhr.supabase.co"
# Dominio ficticio para las cuentas de colaboradores (no se envían correos)
WORKER_EMAIL_DOMAIN = "trabajadores.korporia.com"

# Secretos (no van en este archivo):
#   SUPABASE_SECRET_KEY       (sb_secret_…)
#   SUPABASE_PUBLISHABLE_KEY  (sb_publishable_…)
# Se cargan en Cloudflare → Worker → Settings → Variables and Secrets,
# o con: wrangler secret put <NOMBRE>
# Para desarrollo local, crea apps/api/.dev.vars con esas dos variables.
